name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default: the build runs third-party code (npm and cargo dependencies).
# Only the publish job, which runs no build code, can write.
#
# Actions are pinned to a commit, not a tag: the build job holds the key that signs
# updates for every installed copy, and a tag can be moved to other code. To update
# one, replace the commit and the version in its comment together.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test and build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build installer
        shell: bash
        env:
          # Signs the installer for the app's own updater. Not available to pull requests
          # from forks; those build without update signatures.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The Path of Building service's address and its key for this release, built
          # into the app (not kept in the source). Without them, builds' other loadouts
          # can't be calculated.
          POB_SERVICE_URL: ${{ secrets.POB_SERVICE_URL }}
          POB_SERVICE_KEY: ${{ secrets.POB_SERVICE_KEY }}
        # 0.1.<run> so an install shows which build it is and the updater sees it as newer.
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '{"version":"0.1.${{ github.run_number }}"}' > ci-version.json
          else
            echo '{"version":"0.1.${{ github.run_number }}","bundle":{"createUpdaterArtifacts":false}}' > ci-version.json
          fi
          pnpm tauri build --config ci-version.json
          cp src-tauri/target/release/bundle/nsis/*-setup.exe PoE-Tool-setup.exe

      # What the app's updater reads: the newest version and where its signed installer is.
      - name: Write the update manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          sig=$(cat src-tauri/target/release/bundle/nsis/*-setup.exe.sig)
          url="https://github.com/${{ github.repository }}/releases/download/nightly/PoE-Tool-setup.exe"
          jq -n --arg version "0.1.${{ github.run_number }}" --arg sig "$sig" --arg url "$url" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg notes "Built from ${GITHUB_SHA::7} on main." \
            '{version: $version, notes: $notes, pub_date: $date,
              platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' > latest.json
          cat latest.json

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: poe-tool-windows-x64-${{ github.run_number }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/poe-tool.exe
          if-no-files-found: error

      - name: Upload installer for the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-installer
          path: |
            PoE-Tool-setup.exe
            latest.json
          if-no-files-found: error

  # A fixed link to the newest installer, no zip:
  # https://github.com/<owner>/<repo>/releases/download/nightly/PoE-Tool-setup.exe
  publish:
    name: Publish the nightly release
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-installer

      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly PoE-Tool-setup.exe latest.json --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (0.1.${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7} on main. Download PoE-Tool-setup.exe and run it; installed apps update themselves."
